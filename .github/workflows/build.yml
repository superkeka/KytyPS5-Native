name: Build KytyPS5-Native

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SCCACHE_GHA_ENABLED: "true"
  KYTY_BUILD_ORIGIN: ${{ github.repository != 'KytyPS5/KytyPS5' && 'Fork' || github.event_name == 'push' && 'Official' || 'Source' }}
  KYTY_BUILD_REPOSITORY: ${{ github.repository }}

jobs:
  metadata:
    name: Prepare build metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release_tag.outputs.value }}

    steps:
      - name: Generate release tag
        id: release_tag
        shell: bash
        run: |
          echo "value=KytyPS5-Native-$(date -u +'%Y-%m-%d')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  linux:
    name: Build KytyPS5 (Linux)
    needs: metadata
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            clang \
            glslang-tools \
            libasound2-dev \
            libdbus-1-dev \
            libgl1-mesa-dev \
            libpulse-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxss-dev \
            libxtst-dev \
            lld \
            pkg-config \
            wayland-protocols

      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Verify toolchain
        shell: bash
        run: |
          git --version
          cmake --version
          ninja --version
          clang++ --version
          ld.lld --version
          glslangValidator --version
          echo "Qt6_DIR=$Qt6_DIR"

      - name: Configure
        shell: bash
        run: |
          mkdir -p _Build
          cmake -S . -B _Build/linux \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DKYTY_BUILD_ORIGIN="$KYTY_BUILD_ORIGIN" \
            -DKYTY_BUILD_REPOSITORY="$KYTY_BUILD_REPOSITORY" \
            -DKYTY_RELEASE_TAG="${{ needs.metadata.outputs.release_tag }}" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_PREFIX_PATH="$Qt6_DIR" 2>&1 | tee _Build/configure.log
          exit "${PIPESTATUS[0]}"

      - name: Verify SDL3 backends
        shell: bash
        run: |
          status=0
          for feature in SDL_ALSA SDL_PULSEAUDIO SDL_WAYLAND SDL_X11 SDL_LIBUDEV SDL_DBUS; do
            if grep -qE "^--   ${feature} +\\(Wanted: ON\\): ON" _Build/configure.log; then
              echo "ok   ${feature}"
            else
              echo "FAIL ${feature} is not enabled"
              status=1
            fi
          done
          exit "$status"

      - name: Build
        shell: bash
        run: |
          cmake --build _Build/linux \
            --target launcher page_manager_tests memory_tracker_tests \
              audio_out2_port_tests pad_haptics_tests controller_settings_tests host_input_tests ime_dialog_tests lru_cache_tests virtual_memory_allocation_tests \
              resource_tracking_tests scalar_provenance_tests \
              resource_materialization_tests shader_vertex_metadata_tests archive_file_tests avplayer_file_tests \
            --parallel

      - name: Test
        shell: bash
        run: |
          ctest --test-dir _Build/linux --output-on-failure \
            -R '^(audio_out2_port|pad_haptics|controller_settings|host_input|ime_dialog|lru_cache|memory_tracker|page_manager|resource_tracking|scalar_provenance|resource_materialization|shader_vertex_metadata|archive_file|avplayer_file|virtual_memory_allocation)$'

      - name: Install
        shell: bash
        run: |
          cmake --install _Build/linux --prefix _Build/linux/install

      - name: Verify artifacts
        shell: bash
        run: |
          file _Build/linux/install/kyty_launcher
          file _Build/linux/install/kyty_emulator
          test -x _Build/linux/install/kyty_updater
          test -x _Build/linux/install/kyty-lodhw
          file _Build/linux/install/kyty_emulator | grep -q "ELF 64-bit LSB .*x86-64"
          ldd _Build/linux/install/kyty_emulator > /dev/null
          readelf -d _Build/linux/install/kyty_launcher | grep -q 'RPATH.*\$ORIGIN/lib'
          while IFS= read -r -d '' binary; do
            while read -r dependency; do
              test -e "_Build/linux/install/lib/$dependency"
            done < <(
              readelf -d "$binary" |
                sed -n 's/.*Shared library: \[\(libQt6[^]]*\|libicu[^]]*\)\].*/\1/p'
            )
          done < <(
            find _Build/linux/install/kyty_launcher _Build/linux/install/plugins \
              -type f \( -name kyty_launcher -o -name '*.so' \) -print0
          )
          _Build/linux/install/kyty_emulator --help > /dev/null

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Linux-x86_64
          path: _Build/linux/install/**
          if-no-files-found: error

  decky:
    name: Build the Decky plugin
    needs: metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and package
        shell: bash
        working-directory: decky-plugin
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          out="$RUNNER_TEMP/KytyPS5-Native"
          mkdir -p "$out/dist"
          cp plugin.json package.json main.py ../LICENSE ../tools/bc250-lodhw/install-helper.sh "$out/"
          cp dist/index.js "$out/dist/"
          # The plugin compares this with the latest release to offer its own update.
          echo "${{ needs.metadata.outputs.release_tag }}" > "$out/RELEASE"
          (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/KytyPS5-Native-Decky.zip" KytyPS5-Native)

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Native-Decky
          path: KytyPS5-Native-Decky.zip

  release:
    name: Release KytyPS5-Native
    if: >-
      github.event_name == 'push' &&
      github.repository == 'superkeka/KytyPS5-Native' &&
      needs.linux.result == 'success' &&
      needs.decky.result == 'success'
    needs: [metadata, linux, decky]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_NAME: ${{ needs.metadata.outputs.release_tag }}

    steps:
      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: KytyPS5-Linux-x86_64
          path: artifacts/KytyPS5-Linux-x86_64

      - name: Download Decky plugin
        uses: actions/download-artifact@v4
        with:
          name: KytyPS5-Native-Decky
          path: artifacts/decky

      - name: Package Linux build
        shell: bash
        run: |
          linux_dir="artifacts/KytyPS5-Linux-x86_64"
          test -d "$linux_dir"
          chmod a+x \
            "$linux_dir/kyty_launcher" \
            "$linux_dir/kyty_emulator" \
            "$linux_dir/kyty_updater" \
            "$linux_dir/kyty-lodhw" \
            "$linux_dir/install-helper.sh" \
            "$linux_dir/kytyps5-run.sh"
          tar -C "$linux_dir" -czf \
            "$GITHUB_WORKSPACE/$RELEASE_NAME-Linux-x86_64.tar.gz" .
          cp artifacts/decky/KytyPS5-Native-Decky.zip "$GITHUB_WORKSPACE/$RELEASE_NAME-Decky.zip"

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=("$RELEASE_NAME-Linux-x86_64.tar.gz" "$RELEASE_NAME-Decky.zip")
          if gh release view "$RELEASE_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_NAME" "${assets[@]}" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME"
          fi
